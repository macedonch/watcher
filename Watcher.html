<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watcher</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#000;--bg2:#070707;--card:#0a0a0a;--card-h:#0f0f0f;
  --w:#f0f0f0;--g1:#ccc;--g2:#777;--g3:#444;--g4:#222;--g5:#111;
  --b:rgba(255,255,255,.05);--bh:rgba(255,255,255,.1);
  --glass:rgba(6,6,6,.75);--gb:rgba(255,255,255,.04);
  --f:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
  --e:cubic-bezier(.4,0,.2,1);--eo:cubic-bezier(.16,1,.3,1);--es:cubic-bezier(.34,1.4,.64,1)
}
html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#333 transparent}
body{font-family:var(--f);font-weight:600;background:var(--bg);color:var(--w);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}

.topbar{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;padding:10px 20px;gap:16px;background:rgba(0,0,0,.85);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);border-bottom:1px solid var(--b);animation:topIn .7s var(--eo) both}
@keyframes topIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}

.brand{display:flex;align-items:center;gap:1px;cursor:pointer;flex-shrink:0;text-decoration:none}
.logo-w{width:34px;height:34px;perspective:300px;flex-shrink:0}
.logo-c{width:34px;height:34px;border-radius:9px;background:#000;border:1.5px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;animation:globeSpin 5s linear infinite;transform-style:preserve-3d}
.logo-c svg{width:20px;height:20px;fill:#fff}
@keyframes globeSpin{0%{transform:rotateY(0) rotateX(4deg)}100%{transform:rotateY(360deg) rotateX(4deg)}}
.brand-t{font-size:1.2rem;font-weight:900;letter-spacing:-.04em;color:var(--g1)}
.brand:hover .brand-t{color:#fff}

.nav-pills{display:flex;align-items:center;gap:3px;padding:4px;background:rgba(255,255,255,.03);border-radius:14px;border:1px solid var(--b)}
.pill{padding:7px 16px;border-radius:11px;font-size:.8rem;font-weight:700;color:var(--g2);cursor:pointer;transition:all .45s var(--es);text-decoration:none;white-space:nowrap;user-select:none}
.pill:hover{color:#fff;background:rgba(255,255,255,.06)}
.pill.active{color:#fff;background:rgba(255,255,255,.1);transform:scale(1.02)}

.topbar-spacer{flex:1}

.lang-btn{display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--b);color:var(--g2);font-size:.74rem;font-weight:700;cursor:pointer;transition:all .3s;flex-shrink:0;position:relative}
.lang-btn:hover{color:#fff;background:rgba(255,255,255,.07)}
.lang-btn .gi{width:13px;height:13px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.lang-btn .cv{width:8px;height:8px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--eo)}
.lang-btn.open .cv{transform:rotate(180deg)}
.lp{position:absolute;top:calc(100% + 8px);right:0;width:190px;background:rgba(6,6,6,.96);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid var(--b);border-radius:13px;box-shadow:0 16px 50px rgba(0,0,0,.9);padding:5px;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.97);transition:all .3s var(--eo);z-index:200}
.lp.open{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
.lp-t{padding:7px 10px 4px;font-size:.58rem;font-weight:700;color:var(--g3);text-transform:uppercase;letter-spacing:.12em}
.lo{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;cursor:pointer;transition:all .2s;font-size:.79rem;font-weight:700;color:var(--g2)}
.lo:hover{background:rgba(255,255,255,.05);color:#fff}
.lo.ac{color:#fff;background:rgba(255,255,255,.07)}
.lo .ck{width:12px;height:12px;opacity:0}.lo.ac .ck{opacity:1}
.lo .ck svg{width:12px;height:12px;stroke:#fff;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}

main{padding-top:60px;min-height:100vh}

.content{max-width:1400px;margin:0 auto;padding:20px 20px 60px}

.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-t{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:8px}
.badge{font-size:.6rem;padding:2px 7px;border-radius:5px;background:rgba(255,255,255,.04);color:var(--g2)}

.streams-wrap{margin-bottom:28px}
.streams-scroll{display:flex;gap:12px;overflow-x:auto;padding:2px 0 12px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.streams-scroll::-webkit-scrollbar{display:none}
.s-card{min-width:320px;max-width:320px;scroll-snap-align:start;background:var(--card);border:1px solid var(--b);border-radius:16px;overflow:hidden;transition:all .45s var(--e);flex-shrink:0;cursor:pointer}
.s-card:hover{border-color:var(--bh);transform:translateY(-3px);box-shadow:0 12px 36px rgba(0,0,0,.4)}
.s-embed{position:relative;width:100%;padding-top:56.25%;background:var(--g5)}
.s-embed iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.s-body{padding:10px 12px}
.s-body h3{font-size:.82rem;font-weight:700;margin-bottom:2px}
.s-meta{font-size:.68rem;color:var(--g3)}
.scroll-btns{display:flex;gap:5px}
.sbtn{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid var(--b);color:var(--g2);transition:all .3s}
.sbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.sbtn svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

.search-row{display:flex;gap:8px;margin-bottom:20px}
.si{flex:1;padding:11px 16px;border-radius:12px;border:1px solid var(--b);background:var(--card);color:#fff;font-family:var(--f);font-size:.84rem;font-weight:600;outline:none;transition:all .35s}
.si:focus{border-color:rgba(255,255,255,.14)}
.si::placeholder{color:var(--g3)}
.sb{padding:11px 22px;border-radius:12px;background:#fff;color:#000;font-family:var(--f);font-size:.84rem;font-weight:700;border:none;cursor:pointer;transition:all .35s;white-space:nowrap}
.sb:hover{transform:translateY(-1px)}

.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px}
.vc{background:var(--card);border:1px solid var(--b);border-radius:14px;overflow:hidden;transition:all .5s var(--e);cursor:pointer}
.vc:hover{border-color:var(--bh);transform:translateY(-4px);box-shadow:0 14px 40px rgba(0,0,0,.4)}
.vt{position:relative;width:100%;padding-top:56.25%;background:var(--g5);overflow:hidden}
.vt img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--e)}
.vc:hover .vt img{transform:scale(1.04)}
.vp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;transition:all .5s var(--e);opacity:0}
.vc:hover .vp{opacity:1;transform:translate(-50%,-50%) scale(1)}
.vp svg{width:16px;height:16px;fill:#fff;margin-left:2px}
.vd{position:absolute;bottom:5px;right:5px;padding:2px 5px;border-radius:4px;background:rgba(0,0,0,.7);font-size:.62rem}
.vb{padding:10px 12px}
.vb h3{font-size:.82rem;font-weight:700;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.vm{font-size:.68rem;color:var(--g3);display:flex;gap:6px;flex-wrap:wrap}

.loading{text-align:center;padding:30px;color:var(--g3);font-size:.82rem}
.loading .sp{width:22px;height:22px;border:2px solid var(--g4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 8px}
@keyframes spin{to{transform:rotate(360deg)}}
.note{background:var(--card);border:1px solid rgba(255,200,0,.1);border-radius:14px;padding:12px 14px;margin-bottom:18px;font-size:.76rem;color:var(--g2);line-height:1.5}

.modal{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.97);display:none;opacity:0;transition:opacity .4s var(--e);overflow-y:auto}
.modal.open{display:block;opacity:1}
.modal-inner{max-width:1200px;margin:0 auto;padding:64px 20px 40px;display:flex;gap:20px}
.modal-main{flex:1;min-width:0}
.modal-side{width:340px;flex-shrink:0}
.modal-close{position:fixed;top:14px;right:20px;z-index:10;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;backdrop-filter:blur(8px)}
.modal-close:hover{background:rgba(255,255,255,.12);transform:scale(1.08)}
.modal-close svg{width:14px;height:14px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pw{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:14px;overflow:hidden}
.pw iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.mi{padding:16px 0}
.mi-title{font-size:1.15rem;font-weight:700;margin-bottom:6px;line-height:1.3}
.mi-meta{font-size:.78rem;color:var(--g2);margin-bottom:14px}
.mi-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.act-btn{display:flex;align-items:center;gap:5px;padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid var(--b);color:var(--g1);font-size:.78rem;font-weight:700;cursor:pointer;transition:all .3s}
.act-btn:hover{background:rgba(255,255,255,.1)}
.act-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.act-btn.liked{background:rgba(255,255,255,.12);color:#fff}
.comments-area{border-top:1px solid var(--b);padding-top:16px}
.comment-input-row{display:flex;gap:8px;margin-bottom:16px}
.comment-input{flex:1;padding:10px 14px;border-radius:10px;border:1px solid var(--b);background:var(--card);color:#fff;font-family:var(--f);font-size:.82rem;font-weight:600;outline:none}
.comment-btn{padding:10px 16px;border-radius:10px;background:#fff;color:#000;font-size:.8rem;font-weight:700;border:none;cursor:pointer}
.comment-list{display:flex;flex-direction:column;gap:10px}
.comment-item{padding:10px;background:rgba(255,255,255,.02);border-radius:10px;border:1px solid var(--b)}
.comment-user{font-size:.74rem;font-weight:700;color:var(--g1);margin-bottom:3px}
.comment-text{font-size:.8rem;color:var(--g2);font-weight:500;line-height:1.4}
.side-card{background:var(--card);border:1px solid var(--b);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .4s;display:flex;gap:10px;padding:8px;margin-bottom:8px}
.side-card:hover{background:var(--card-h);border-color:var(--bh)}
.side-thumb{width:160px;height:90px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--g5)}
.side-thumb img{width:100%;height:100%;object-fit:cover}
.side-info{flex:1;min-width:0;padding:2px 0}
.side-info h4{font-size:.76rem;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;margin-bottom:3px}
.side-info .sm{font-size:.66rem;color:var(--g3)}

.stream-modal .pw{padding-top:0;height:auto;display:flex;gap:0;border-radius:14px;overflow:hidden}
.stream-player{flex:1;position:relative;padding-top:56.25%}
.stream-player iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.stream-chat{width:340px;height:0;padding-top:56.25%;position:relative;background:var(--g5);border-left:1px solid var(--b)}
.stream-chat iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}

.profile-sec{padding:40px 20px}
.profile-wrap{max-width:460px;margin:0 auto;text-align:center}
.av{width:80px;height:80px;border-radius:50%;background:linear-gradient(145deg,#fff,#333);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;position:relative}
.av::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:1.5px solid rgba(255,255,255,.07)}
.av svg{width:32px;height:32px;stroke:#000;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pname{font-size:1.3rem;font-weight:700;margin-bottom:3px}
.phandle{font-size:.74rem;color:var(--g3);margin-bottom:20px}
.pfield{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;text-align:left}
.pfield label{font-size:.68rem;color:var(--g3);text-transform:uppercase;letter-spacing:.08em}
.pfield input{padding:9px 12px;border-radius:10px;border:1px solid var(--b);background:var(--card);color:#fff;font-family:var(--f);font-size:.82rem;font-weight:600;outline:none}
.psave{padding:9px 20px;border-radius:10px;background:#fff;color:#000;font-family:var(--f);font-size:.8rem;font-weight:700;border:none;cursor:pointer;margin-top:6px}
.pcard{background:var(--card);border:1px solid var(--b);border-radius:16px;padding:22px;margin-top:20px;text-align:left}
.pcard h3{font-size:.86rem;font-weight:700;margin-bottom:12px}
.pr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--b)}
.pr:last-child{border-bottom:none}
.prl{font-size:.8rem;color:var(--g2);font-weight:600}
.prv{font-size:.8rem;font-weight:700}

@media(max-width:1024px){.vgrid{grid-template-columns:repeat(3,1fr)}.modal-side{width:280px}}
@media(max-width:768px){
  .vgrid{grid-template-columns:repeat(2,1fr);gap:10px}
  .modal-inner{flex-direction:column;padding:56px 12px 24px}.modal-side{width:100%}
  .stream-chat{display:none}
  .s-card{min-width:260px;max-width:260px}
  .brand-t{display:none}
  .pill span{display:none}.pill{padding:6px 10px}
  .topbar{padding:8px 12px;gap:8px}
  .lp{right:-40px}
}
@media(max-width:480px){.vgrid{grid-template-columns:repeat(2,1fr);gap:8px}.content{padding:14px 12px 40px}}
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="#">
    <div class="logo-w"><div class="logo-c"><svg viewBox="0 0 80 80"><rect width="80" height="80" rx="12" fill="#000"/><path d="M16 20h10l7 28 9-28h10l-16 40h-8L16 20zm22 0h10l9 28 7-28h10L58 60h-8L36 20z" fill="#fff"/></svg></div></div>
    <span class="brand-t">atcher</span>
  </a>
  <nav class="nav-pills">
    <a class="pill active" onclick="goSec('top')"><span>Home</span></a>
    <a class="pill" onclick="goSec('str')"><span>Streams</span></a>
    <a class="pill" onclick="goSec('vid')"><span>Videos</span></a>
    <a class="pill" onclick="goSec('prof')"><span>Profile</span></a>
  </nav>
  <div class="topbar-spacer"></div>
  <div class="lang-btn" id="lT" onclick="toggleL()">
    <svg class="gi" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10A15.3 15.3 0 0112 2z"/></svg>
    <span id="cL">EN</span>
    <svg class="cv" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    <div class="lp" id="lP"></div>
  </div>
</div>

<div class="modal" id="vidModal">
  <div class="modal-close" onclick="closeVid()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
  <div class="modal-inner">
    <div class="modal-main">
      <div class="pw" id="vidPW"></div>
      <div class="mi">
        <div class="mi-title" id="vidTitle"></div>
        <div class="mi-meta" id="vidMeta">Watcher Player</div>
        <div class="mi-actions">
          <div class="act-btn" onclick="this.classList.toggle('liked')"><svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3H14z"/><path d="M7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3"/></svg><span data-t="like">Like</span></div>
          <div class="act-btn" onclick="this.classList.toggle('liked')"><svg viewBox="0 0 24 24" style="transform:rotate(180deg)"><path d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3H14z"/><path d="M7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3"/></svg><span data-t="dislike">Dislike</span></div>
          <div class="act-btn"><svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg><span data-t="share">Share</span></div>
        </div>
        <div class="comments-area">
          <div class="sec-t" style="margin-bottom:12px;font-size:.88rem" data-t="comments">Comments</div>
          <div class="comment-input-row"><input class="comment-input" id="cmtIn" placeholder="Add a comment..." data-tp="comment_ph"><button class="comment-btn" onclick="addComment()" data-t="post">Post</button></div>
          <div class="comment-list" id="cmtList"></div>
        </div>
      </div>
    </div>
    <div class="modal-side">
      <div class="sec-t" style="margin-bottom:10px;font-size:.84rem" data-t="related">Related</div>
      <div id="relatedList"></div>
    </div>
  </div>
</div>

<div class="modal" id="strModal">
  <div class="modal-close" onclick="closeStr()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
  <div class="modal-inner">
    <div class="modal-main">
      <div style="display:flex;border-radius:14px;overflow:hidden;background:#000">
        <div style="flex:1;position:relative;padding-top:42%"><iframe id="strPlayer" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none" allowfullscreen></iframe></div>
        <div style="width:340px;position:relative;background:var(--g5)" id="chatWrap"><iframe id="strChat" style="width:100%;height:100%;border:none;position:absolute;top:0;left:0" allowfullscreen></iframe></div>
      </div>
      <div class="mi"><div class="mi-title" id="strTitle"></div><div class="mi-meta">Twitch Stream</div></div>
    </div>
  </div>
</div>

<main>
<div class="content" id="top">
  <div id="str" class="streams-wrap">
    <div class="sec-head"><div class="sec-t" data-t="live_now">Live Now <span class="badge">Twitch</span></div><div class="scroll-btns"><div class="sbtn" onclick="sScroll(-1)"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div><div class="sbtn" onclick="sScroll(1)"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div></div></div>
    <div class="streams-scroll" id="sRow"></div>
  </div>

  <div id="vid">
    <div class="sec-t" style="margin-bottom:14px" data-t="videos">Videos</div>
    <div class="search-row"><input class="si" id="sIn" type="text" onkeydown="if(event.key==='Enter')doS()" data-tp="search_ph"><button class="sb" onclick="doS()" data-t="search">Search</button></div>
    <div class="note" id="nBox" style="display:none"></div>
    <div id="recW" style="display:none"><div class="sec-t" style="margin-bottom:12px" data-t="for_you">For You <span class="badge" data-t="recommended">Recommended</span></div><div class="vgrid" id="recG"></div></div>
    <div id="trW"><div class="sec-t" style="margin-bottom:12px" data-t="trending">Trending</div><div id="trB"><div class="loading"><div class="sp"></div><span data-t="loading">Loading...</span></div></div></div>
    <div id="seW" style="display:none"><div class="sec-t" id="seL" style="margin-bottom:12px">Results</div><div class="vgrid" id="seG"></div></div>
  </div>

  <div id="prof" class="profile-sec">
    <div class="profile-wrap">
      <div class="av"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 00-16 0"/></svg></div>
      <div class="pname" id="pN">Wanderer</div>
      <div class="phandle" id="pH">@guest</div>
      <div class="pfield"><label data-t="display_name">Display Name</label><input id="nI" type="text" maxlength="30"></div>
      <div class="pfield"><label data-t="username_label">Username (English only)</label><input id="uI" type="text" maxlength="20" pattern="[a-zA-Z0-9_]+"></div>
      <button class="psave" onclick="saveP()" data-t="save">Save Profile</button>
      <div class="pcard"><h3 data-t="stats">Stats</h3>
